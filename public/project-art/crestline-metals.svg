    <path d="M250 95c-23-20-51-30-82-30-66 0-116 46-116 105s50 105 116 105c31 0 59-10 82-30l-36-39c-12 11-27 17-44 17-34 0-59-22-59-53s25-53 59-53c17 0 32 6 44 17z" fill="#eef3f6"/>
